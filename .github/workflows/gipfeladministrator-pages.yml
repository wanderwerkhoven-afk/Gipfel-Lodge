name: Publish GipfelAdministrator Preview

on:
  push:
    branches:
      - build/gipfeladministrator-from-scratch
    paths:
      - "GipfelAdministrator/**"
      - ".github/workflows/gipfeladministrator-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gipfeladministrator-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GipfelAdministrator
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: GipfelAdministrator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build admin preview
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: GipfelAdministrator/apps/admin/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
