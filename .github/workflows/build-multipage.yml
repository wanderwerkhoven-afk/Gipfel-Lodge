name: Build and deploy multipage website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/pages/**'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'scripts/build-multipage.cjs'
      - 'package.json'
      - '.github/workflows/build-multipage.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: MPA_PREVIEW=1 npm run build:mpa
      - name: Verify public page routes
        run: |
          test -f dist/mpa/index.html
          test -f dist/mpa/lodge/index.html
          test -f dist/mpa/activiteiten/index.html
          test -f dist/mpa/genieten/index.html
          test -f dist/mpa/booking/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/mpa
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
