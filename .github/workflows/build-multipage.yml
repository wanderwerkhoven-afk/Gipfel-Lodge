name: Build multipage website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'js/**'
      - 'css/**'
      - 'assets/**'
      - 'scripts/build-multipage.cjs'
      - 'package.json'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build:mpa
      - uses: actions/upload-artifact@v4
        with:
          name: gipfel-multipage
          path: dist/mpa
